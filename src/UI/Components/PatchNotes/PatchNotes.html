<div id="PatchNotes">
	<div class="titlebar">
		<div class="slice left"><ui-image src="basic_interface/titlebar_left.bmp"></ui-image></div>
		<div class="slice mid"><ui-image src="basic_interface/titlebar_mid.bmp"></ui-image></div>
		<div class="slice right"><ui-image src="basic_interface/titlebar_right.bmp"></ui-image></div>
		<span class="text">Patch Notes</span>
	</div>
	<div class="body">
		<div class="side left"><ui-image src="basic_interface/itemwin_left.bmp"></ui-image></div>
		<div class="head">
			<div class="poring"><ui-image src="basic_interface/notice_poring.bmp"></ui-image></div>
			<div class="info">
				<div class="title"></div>
				<div class="meta"></div>
			</div>
			<div class="count"></div>
		</div>
		<div class="content"></div>
		<div class="side right"><ui-image src="basic_interface/itemwin_right.bmp"></ui-image></div>
	</div>
	<div class="footer">
		<div class="slice left"><ui-image src="basic_interface/btnbar_left2.bmp"></ui-image></div>
		<div class="slice mid"><ui-image src="basic_interface/btnbar_mid2.bmp"></ui-image></div>
		<div class="slice right"><ui-image src="basic_interface/btnbar_right2.bmp"></ui-image></div>
		<ui-button class="btn back" bg="btn_back.bmp" hover="btn_back_a.bmp" down="btn_back_b.bmp"></ui-button>
		<ui-button class="btn next" bg="btn_next.bmp" hover="btn_next_a.bmp" down="btn_next_b.bmp"></ui-button>
		<ui-button class="btn ok" bg="btn_ok.bmp" hover="btn_ok_a.bmp" down="btn_ok_b.bmp"></ui-button>
	</div>
</div>
