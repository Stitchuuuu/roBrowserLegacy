<div id="RemoteCharacters">
	<div class="titlebar">
		<div class="slice left"><ui-image src="basic_interface/titlebar_left.bmp"></ui-image></div>
		<div class="slice mid"><ui-image src="basic_interface/titlebar_mid.bmp"></ui-image></div>
		<div class="slice right"><ui-image src="basic_interface/titlebar_right.bmp"></ui-image></div>
		<span class="text">Remote characters</span>
	</div>
	<div class="list"></div>
	<div class="footer">
		<div class="slice left"><ui-image src="basic_interface/btnbar_left2.bmp"></ui-image></div>
		<div class="slice mid"><ui-image src="basic_interface/btnbar_mid2.bmp"></ui-image></div>
		<div class="slice right"><ui-image src="basic_interface/btnbar_right2.bmp"></ui-image></div>
		<button
			class="txt settings"
			type="button"
			data-background="navigation_interface3/btn_normal.bmp"
			data-hover="navigation_interface3/btn_over.bmp"
			data-down="navigation_interface3/btn_press.bmp"
		>
			Settings
		</button>
		<button
			class="txt login"
			type="button"
			data-background="navigation_interface3/btn_normal.bmp"
			data-hover="navigation_interface3/btn_over.bmp"
			data-down="navigation_interface3/btn_press.bmp"
		>
			Normal login
		</button>
		<button
			class="btn connect"
			type="button"
			data-background="login_interface/btn_connect.bmp"
			data-hover="login_interface/btn_connect_a.bmp"
			data-down="login_interface/btn_connect_b.bmp"
		></button>
	</div>
</div>
