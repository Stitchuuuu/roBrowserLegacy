<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>roBrowser</title>
		<style>
			:root {
				--bg: #f4f3ef;
				--card: #ffffff;
				--fg: #1c1c1e;
				--muted: #5d5d63;
				--line: #dcdad4;
				--button: #1c1c1e;
				--button-fg: #ffffff;
				color-scheme: light;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #131315;
					--card: #1d1d20;
					--fg: #ececef;
					--muted: #a2a2a8;
					--line: #34343a;
					--button: #ececef;
					--button-fg: #131315;
					color-scheme: dark;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: var(--bg);
				color: var(--fg);
				font:
					16px/1.55 system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
			}
			main {
				width: 100%;
				max-width: 34em;
				padding: 32px 28px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 12px;
			}
			h1 {
				margin: 0;
				font-size: 1.75em;
				line-height: 1.2;
			}
			.sub {
				margin: 2px 0 20px;
				color: var(--muted);
			}
			a {
				color: inherit;
			}
			.state {
				display: flex;
				gap: 12px;
				align-items: flex-start;
				margin: 24px 0 0;
				padding: 14px 16px;
				border: 1px solid var(--line);
				border-radius: 8px;
			}
			.mark {
				flex: none;
				width: 1.4em;
				font-size: 1.2em;
				line-height: 1.3;
				text-align: center;
			}
			.state p {
				margin: 0;
			}
			.hint {
				color: var(--muted);
				font-size: 0.9em;
			}
			.play {
				display: inline-block;
				margin-top: 20px;
				padding: 10px 28px;
				background: var(--button);
				color: var(--button-fg);
				border-radius: 8px;
				font-weight: 600;
				text-decoration: none;
			}
			.play:focus-visible {
				outline: 2px solid var(--fg);
				outline-offset: 3px;
			}
			[hidden] {
				display: none;
			}
		</style>
	</head>
	<body>
		<main>
			<h1 id="server">roBrowser</h1>
			<p class="sub">Ragnarok Online in your browser</p>
			<p>
				This client runs only in Firefox with the roBrowser relay extension, and a GRF (your Ragnarok client
				folder) that you give to the extension.
			</p>
			<p><a id="install" href="#">Get the roBrowser relay extension</a></p>
			<div class="state" role="status">
				<span id="mark" class="mark" aria-hidden="true">&#x25F7;</span>
				<div>
					<p id="state-text">Looking for the extension...</p>
					<p id="state-hint" class="hint" hidden>Reload this page once it is done.</p>
				</div>
			</div>
			<a id="play" class="play" href="api.html?app=ONLINE" hidden>Play</a>
		</main>
		<script>
			(() => {
				// Until the relay is listed on AMO
				const INSTALL_URL =
					'https://github.com/Stitchuuuu/ro-generic-tools/blob/main/robrowser/tools/firefox-ext/relay/README.md';
				// Same wait as gate.js
				const RELAY_WAIT = 1500;

				// [mark, text, reload hint]
				const STATES = {
					missing: ['✗', 'Install the extension.', true],
					firefox: ['✗', 'This browser is not Firefox. Open this page in Firefox.', false],
					nogrf: [
						'⚠︎',
						'The extension is installed but holds no GRF — open its popup and choose your client folder.',
						true
					],
					off: ['✗', 'The extension is switched off — turn it on in its popup.', true],
					ready: ['✓', 'The extension is ready.', false]
				};

				// The site folder names the server
				const path = location.pathname.split('/');
				const site = path[path.length - 2];
				if (site) {
					document.getElementById('server').textContent = site;
					document.title = `${site} — roBrowser`;
				}

				document.getElementById('install').href = INSTALL_URL;

				function show(state) {
					const entry = STATES[state] || STATES.off;
					document.getElementById('mark').textContent = entry[0];
					document.getElementById('state-text').textContent = entry[1];
					document.getElementById('state-hint').hidden = !entry[2];
					document.getElementById('play').hidden = state !== 'ready';
				}

				// The relay sets the attribute, then fires the event: read the attribute first
				const state = document.documentElement.dataset.roRelay;
				if (state) {
					show(state);
					return;
				}

				const timer = setTimeout(
					() => show(/Firefox\//.test(navigator.userAgent) ? 'missing' : 'firefox'),
					RELAY_WAIT
				);
				window.addEventListener(
					'ro-relay',
					e => {
						const detail = e.detail || {};
						clearTimeout(timer);
						show(detail.state || (detail.ready ? 'ready' : 'off'));
					},
					{ once: true }
				);
			})();
		</script>
	</body>
</html>
